name: Dev staging

on:
  push:
    branches: [ "dev" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push backend
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:dev
            ghcr.io/${{ env.REPO_LOWER }}/backend:dev-${{ github.sha }}

      - name: Build and Push frontend
        uses: docker/build-push-action@v5
        with:
          context: client
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:dev
            ghcr.io/${{ env.REPO_LOWER }}/frontend:dev-${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    if: vars.ENABLE_STAGING == 'true'
    runs-on: [stage-runner]
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dotenv generation
        run: |
          echo "GITHUB_REPO=${{ env.REPO_LOWER }}" > .env
          echo "IMAGES_TAG=dev-${{ github.sha }}" >> .env
          echo "DB_PASS=${{ secrets.DEV_DB_PASS }}" >> .env
          echo "SITE_ADDRESS=${{ secrets.DEV_SITE_ADDRESS }}" >> .env
          echo "RUSTFS_ACCESS_KEY=${{ secrets.DEV_RUSTFS_ACCESS_KEY }}" >> .env
          echo "RUSTFS_SECRET_KEY=${{ secrets.DEV_RUSTFS_SECRET_KEY }}" >> .env

      - name: Deploy
        run: |
          sudo env $(cat .env | xargs) \
            docker stack deploy -c docker-stack.yml miostream-dev --with-registry-auth

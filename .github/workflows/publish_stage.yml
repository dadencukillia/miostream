name: Dev staging

on:
  push:
    branches: [ "dev" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push backend
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:dev
            ghcr.io/${{ env.REPO_LOWER }}/backend:dev-${{ github.sha }}

      - name: Build and Push frontend
        uses: docker/build-push-action@v5
        with:
          context: client
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:dev
            ghcr.io/${{ env.REPO_LOWER }}/frontend:dev-${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    if: vars.ENABLE_STAGING == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Swarm Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SWARM_MANAGER_IP }}
          username: ${{ vars.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REPO_LOWER="${{ env.REPO_LOWER }}"
            export IMAGES_TAG=dev-${{ github.sha }} # Uses last development version we built before
            docker stack deploy -c docker-stack.yml miostream-dev --with-registry-auth

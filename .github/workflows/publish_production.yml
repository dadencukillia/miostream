name: Production deploy

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push backend
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      - name: Build and Push frontend
        uses: docker/build-push-action@v5
        with:
          context: client
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

  deploy-production:
    needs: build-and-push
    if: vars.ENABLE_PRODUCTION == 'true'
    runs-on: [production-runner]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: global-production-deploy-lock
      cancel-in-progress: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          sudo env \
            GITHUB_REPO="${{ env.REPO_LOWER }}" \
            IMAGES_TAG="${{ github.sha }}" \
            DB_PASS="${{ secrets.DB_PASS }}" \
            SITE_ADDRESS="${{ secrets.SITE_ADDRESS }}" \
            RUSTFS_ACCESS_KEY="${{ secrets.RUSTFS_ACCESS_KEY }}" \
            RUSTFS_SECRET_KEY="${{ secrets.RUSTFS_SECRET_KEY }}" \
            docker stack deploy -c docker-stack.yml miostream --with-registry-auth

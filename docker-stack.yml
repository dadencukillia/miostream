services:
  frontend:
    image: ghcr.io/${GITHUB_REPO}/frontend:${IMAGES_TAG:-latest}
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:8080/healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  backend:
    image: ghcr.io/${GITHUB_REPO}/backend:${IMAGES_TAG:-latest}
    command: serve
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      DB_PASS_FILE: /run/secrets/db_pass
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      AUTH_PUBLIC_SIGN_KEY: ${AUTH_PUBLIC_SIGN_KEY}
      AUTH_SECRET_SIGN_KEY_FILE: /run/secrets/auth_secret_sign_key
      SESSION_HMAC_SECRET_FILE: /run/secrets/session_hmac_secret
      OAUTH_STATE_HMAC_SECRET_FILE: /run/secrets/oauth_state_hmac_secret
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      EMBEDDER_URL: ${EMBEDDER_URL}
      EMBEDDER_API_KEY_FILE: /run/secrets/embedder_api_key
      EMBEDDER_MODEL: ${EMBEDDER_MODEL}
      POSTGRES_HOST: postgresql:5432
      REDIS_HOST: redis:6379
      RUSTFS_HOST: rustfs:9000
      MEILI_HOST: meilisearch:7700
    networks:
      - shared
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:8080/healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - db_pass
      - rustfs_access_key
      - rustfs_secret_key
      - auth_secret_sign_key
      - session_hmac_secret
      - oauth_state_hmac_secret
      - oauth_client_secret
      - embedder_api_key
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M

  caddy:
    image: "caddy:2.11.4-alpine"
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    networks:
      - shared
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  postgresql:
    image: "postgres:18.6-alpine3.24"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
      POSTGRES_DB: miostream
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miostream"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal
    secrets:
      - db_pass
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
          - node.labels.dbstorage == true
      resources:
        limits:
          cpus: '0.75'
          memory: 320M
        reservations:
          cpus: '0.10'
          memory: 160M

  redis:
    image: "redis:8.2.2-alpine"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
          - node.labels.redisstorage == true
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  rustfs:
    image: "rustfs/rustfs:1.0.3"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health/ready && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
          - node.labels.rustfsstorage == true
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M

  meilisearch:
    image: "getmeili/meilisearch:v1.58.0"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
          - node.labels.meilisearch == true
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M
    
networks:
  shared:
    driver: overlay
  internal:
    driver: overlay

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  redis-data: {}
  rustfs-data: {}
  meilisearch-data: {}

secrets:
  db_pass:
    external: true
  rustfs_access_key:
    external: true
  rustfs_secret_key:
    external: true
  google_client_secret:
    external: true
  auth_jwt_secret:
    external: true
  auth_secret_sign_key:
    external: true
  session_hmac_secret:
    external: true
  oauth_state_hmac_secret:
    external: true
  oauth_client_secret:
    external: true
  embedder_api_key:
    external: true

services:
  frontend:
    build:
      context: client
      dockerfile: Dockerfile.test
    restart: no
    profiles: ["frontend"]

  backend:
    build:
      context: server
      dockerfile: Dockerfile.test
    restart: no
    environment:
      POSTGRES_HOST: postgresql:5432
      REDIS_HOST: redis:6379
      RUSTFS_HOST: rustfs:9000
    depends_on:
      - postgresql
      - redis
      - rustfs
    profiles: ["backend"]
    env_file: ./.env.sample

  postgresql:
    image: "postgres:18.6-alpine3.24"
    restart: no
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: miostream
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u postgres -d miostream"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles: ["backend"]

  redis:
    image: "redis:8.2.2-alpine"
    restart: no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["backend"]

  rustfs:
    image: "rustfs/rustfs:latest"
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health/ready && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    profiles: ["backend"]
